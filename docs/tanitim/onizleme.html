<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Bilgi Adası bağlantı önizlemesi</title>
<!-- 1200×630 bağlantı önizlemesi (og:image). Üretim: docs/tanitim/README.md -->
<style>
  @font-face { font-family: "Andika"; src: url("../../site/fonts/Andika-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Andika", sans-serif; color: #11302f; position: relative;
    background: radial-gradient(120% 90% at 30% 0%, #7be0dc 0%, #3cc3c0 55%, #2aa9a6 100%); }
  .icon { position: absolute; left: 60px; top: 60px; width: 120px; border-radius: 30px; box-shadow: 0 6px 0 rgba(0,0,0,.14); }
  h1 { position: absolute; left: 60px; top: 200px; margin: 0; font-size: 84px; line-height: 1; }
  p { position: absolute; left: 60px; top: 300px; margin: 0; font-size: 40px; line-height: 1.25; width: 560px; }
  .shot { position: absolute; right: -60px; bottom: 40px; width: 640px; border-radius: 28px; border: 8px solid #fffaf0; box-shadow: 0 10px 0 rgba(0,0,0,.12); }
  .bilge { position: absolute; left: 470px; top: 330px; width: 250px; filter: drop-shadow(0 12px 14px rgba(0,0,0,.2)); }
</style></head><body>
  <img class="icon" src="../../site/img/icon.webp" alt="">
  <h1>Bilgi Adası</h1>
  <p>1–3. sınıf için ücretsiz, reklamsız eğitim oyunu</p>
  <img class="shot" src="../../site/img/ekran_harita.webp" alt="">
  <img class="bilge" src="../../site/img/bilge.webp" alt="">
</body></html>
